name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check backend
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version
      - uses: calcit-lang/setup-calcit@aab12ef8046e89eeb59e1b1d78b3b84c5fde903d # v1.5.2
        with:
          tools: calcit,caps
          caps-version: "0.1.2"
      - name: Check and build frontend
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain
          test "$(calcit --version)" = "0.45.1"
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit fix --workflow strict --verify --format edn
          yarn check
          calcit --check-only --ns app.diary --summary-only
          calcit analyze weak-types --only dynamic-method --summary-only --format json
          calcit analyze weak-types --only deprecated-call --summary-only --format json
          yarn compile
          yarn build
